<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>② 자동 입력 확인</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="dots"><i class="s"></i><i class="s"></i><i></i></span></div>
  <div class="bar"><span class="back"></span>식품 글쓰기<span class="step">2 / 3</span></div>
  <div class="body">
    <div class="field"><label>제목</label><div class="v">통조림 선물세트 (미개봉)</div></div>
    <div class="field"><label>가격</label><div class="v">20,000원</div></div>
    <div class="field auto">
      <label>소비기한</label>
      <div class="v">2027-05-08 <span class="badge">자동 입력</span></div>
      <div class="cap">사진에서 읽은 부분</div>
      <div class="crop"><img src="date_crop.jpg" alt=""></div>
    </div>
    <div class="hint">사진의 날짜와 <b>같은지 확인</b>해 주세요</div>
    <div class="row"><div class="btn ghost">직접 수정</div><div class="btn primary">맞아요</div></div>
    <div class="note"><b>확신이 낮으면 빈칸</b>으로 둡니다. 그때는 지금처럼 직접 입력합니다.</div>
  </div>
</div>
</body></html>
